* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head-bg); }
.num, td.n, .kpi .v { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }

header.bar {
